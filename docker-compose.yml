services:
  api:
    build: .
    image: museum-light-budget:latest
    container_name: museum-light-budget
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/museum.db
    volumes:
      - museum-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  museum-data:
